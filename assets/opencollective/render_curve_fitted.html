<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 2736px;
    height: 650px;
    overflow: hidden;
    background: #060913;
    position: relative;
  }
  .bg-img {
    position: absolute;
    /* Shifted slightly further right so it centers right in the Open Collective opening */
    right: -40px;
    top: 50%;
    transform: translateY(-50%);
    width: 1750px;
    height: 984px;
    object-fit: cover;
  }
  .fade-mask {
    position: absolute;
    inset: 0;
    /* Soft fade matching the curve angle */
    background: linear-gradient(105deg, #060913 0%, #060913 36%, rgba(6, 9, 19, 0.9) 48%, transparent 66%);
  }
  .grid {
    position: absolute;
    inset: 0;
    background-size: 40px 40px;
    background-image: 
      linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
  }
  .ambient-glow {
    position: absolute;
    right: 20%;
    top: 50%;
    transform: translateY(-50%);
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(0, 210, 255, 0.2) 0%, transparent 70%);
    filter: blur(60px);
  }
</style>
